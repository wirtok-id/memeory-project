project_id = "memeory"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://memeory-project.onrender.com"
additional_redirect_urls = ["https://memeory-project.onrender.com/auth/callback", "memeory://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions]
enabled = true

[functions.agent-trend-collector]
schedule = "0 */6 * * *"

[functions.agent-analytics]
schedule = "0 0 * * *"

[functions.agent-viral-prediction]
schedule = "0 12 * * *"
